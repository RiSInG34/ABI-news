name: Vérifier les news ABI

on:
  schedule:
    # Toutes les heures. Modifiable : https://crontab.guru
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le script de veille
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_news.py

      - name: Publier les changements s'il y en a
        run: |
          git config user.name "abi-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/state.json
          git diff --cached --quiet || git commit -m "Actu : mise à jour automatique"
          git push
